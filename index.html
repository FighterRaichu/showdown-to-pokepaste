<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showdown a Pokepaste Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Convertidor de Showdown a Pokepaste</h1>
        <p>Pega el enlace de Showdown (psim.us) o el texto exportado del equipo:</p>
        
        <textarea id="inputShowdown" rows="5" placeholder="Ej: https://psim.us/t/... o pega el texto plano del Teambuilder"></textarea>
        <button id="btnConvertir" onclick="convertirEquipo()">Convertir a Pokepaste</button>

        <div id="loading" class="hidden">Procesando equipo... por favor espera.</div>
        
        <div id="resultado" class="hidden">
            <h3>¡Éxito!</h3>
            <a id="linkResultado" href="#" target="_blank"></a>
        </div>
        
        <div id="error" class="hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
